<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة التحقق من عناوين الماجستير والدكتوراه - الجامعة العراقية - كلية التربية للبنات</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header, footer {
            background-color: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 15px;
        }
        .container {
            flex: 1;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            color: #0f172a;
            text-align: center;
            margin-bottom: 20px;
        }
        #titles-container {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 15px;
            background-color: #f9fafb;
        }
        .titles-list {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        .titles-list li {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 0.95rem;
        }
        .titles-list li:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>منظومة التحقق من عناوين الماجستير والدكتوراه - كلية التربية للبنات</h1>
    </header>

    <div class="container">
        <h2>قواعد العناوين المخزنة</h2>
        <div id="titles-container">
            <p style="text-align: center; color: #64748b;">جاري تحميل العناوين من السجل...</p>
        </div>
    </div>

    <footer>
        جميع الحقوق محفوظة © 2026 - إعداد وبرمجة النظام: م.د. محمد خليل حسن
    </footer>

    <script>
        // رابط الـ CSV المعتمد لجدول بيانات جوجل
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQV2gEur4V5-I89W4AbQVfSwUoQ6TF_hA7JItNN28cTz_V99_Koxf4mMUvT20p/pub?output=csv';

        fetch(csvUrl)
          .then(response => response.text())
          .then(data => {
              const rows = data.split('\n');
              let htmlContent = '<ul class="titles-list">';
              
              rows.forEach(row => {
                  const cleanRow = row.trim();
                  if (cleanRow !== "") {
                      htmlContent += <li>${cleanRow}</li>;
                  }
              });
              
              htmlContent += '</ul>';
              document.getElementById('titles-container').innerHTML = htmlContent;
          })
          .catch(error => {
              console.error('خطأ في جلب البيانات:', error);
              document.getElementById('titles-container').innerHTML = '<p style="text-align: center; color: #dc2626;">تعذر تحميل العناوين حالياً.</p>';
          });
    </script>
</body>
</html>

        body {

            color: #1e293b;

            flex-direction: column;
            min-height: 100vh;

        .header {
            background-color: #0b5563;
            color: #ffffff;
            text-align: center;
            padding: 25px 15px;

        .container {

            flex: 1;
        }

        .status-card {
            background: #ffffff;

        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
        }

        .admin-btn {

        }

            margin-bottom: 15px;
        }

            font-size: 1rem;
            color: #0f172a;
            margin-bottom: 12px;
            display: block;
        }

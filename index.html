<script>
    let titlesDatabase = [];

    // رابط CSV من جوجل ملفوف بـ CORS Proxy لجلب سريع ومباشر
    const rawCsvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQV2gEur4V5-I89W4AbQVfSwUoQ6TF_hA7JItNN28cTz_V99_Koxf4mMUvT20p/pub?output=csv';
    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(rawCsvUrl);

    // جلب البيانات الفوري
    fetch(proxyUrl)
        .then(response => {
            if (!response.ok) throw new Error('شبكة غير مستجيبة');
            return response.text();
        })
        .then(data => {
            const rows = data.split('\n');
            let htmlContent = '<ul style="list-style:none; padding:0; margin:0;">';
            
            titlesDatabase = [];
            
            rows.forEach(row => {
                const cleanRow = row.trim();
                if (cleanRow !== "") {
                    titlesDatabase.push(cleanRow.toLowerCase());
                    htmlContent += <li style="padding: 8px 10px; border-bottom: 1px solid #e2e8f0; font-size: 0.9rem;">${cleanRow}</li>;
                }
            });
            
            htmlContent += '</ul>';
            
            // تحديث الواجهة بالعناوين فوراً
            const container = document.getElementById('titles-container');
            if (container) {
                container.innerHTML = htmlContent;
            }
        })
        .catch(err => {
            console.error("خطأ في جلب قاعدة البيانات:", err);
            const container = document.getElementById('titles-container');
            if (container) {
                container.innerHTML = '<p style="text-align:center; color:#dc2626; font-size:0.9rem;">تعذر جلب العناوين تلقائياً، يرجى إعادة تحديث الصفحة.</p>';
            }
        });

    // دالة الفحص السريع عند الكتابة
    function checkTitle() {
        const input = document.getElementById('titleInput').value.trim().toLowerCase();
        const badge = document.getElementById('resultBadge');

        if (!badge) return;

        if (input === "") {
            badge.className = "badge badge-waiting";
            badge.style.backgroundColor = "#f1f5f9";
            badge.style.color = "#64748b";
            badge.innerHTML = "بانتظار إدخال العنوان للتدقيق...";
            return;
        }

        const isMatch = titlesDatabase.some(title => title.includes(input));

        if (isMatch) {
            badge.style.backgroundColor = "#fee2e2";
            badge.style.color = "#b91c1c";
            badge.innerHTML = "🔴 العنوان مدروس سابقاً (غير متاح)";
        } else {
            badge.style.backgroundColor = "#d1fae5";
            badge.style.color = "#047857";
            badge.innerHTML = "🟢 العنوان غير مدروس (متاح)";
        }
    }
</script>
